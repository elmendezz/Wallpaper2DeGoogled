# Version: 8
# ChangeLog:
# - Versión inicial: Configuración de runner Ubuntu, setup de JDK 17 y Android SDK.
# - Clonación del repositorio AOSP WallpaperPicker2 desde Google Source.
# - Inyección de configuración Gradle básica (settings.gradle, build.gradle, wrapper).
# - Automatización de compilación de APK en modo Release/Unsigned.
# - Carga del APK resultante a los artifacts de GitHub Actions.
# - Corrección de error de Gradle 9.x: Inyección del bloque pluginManagement y definición de versión de com.android.application (8.2.2).
# - Inyección de repositorios google() y mavenCentral() en settings.gradle y build.gradle.
# - Adición de paso de firmado de APK usando apksigner con keystore de depuración.
# - Adición de generación automática de tag y release en GitHub con formato Wallpaper2-Build-YYYYMMDD-HHMM.
# - Adjuntado automático del archivo APK firmado directamente a la Release pública.
# - Solución al error AndroidXDependencyCheck: Inyección de gradle.properties habilitando android.useAndroidX=true y android.enableJetifier=true.
# - Solución al error ProcessApplicationManifest: Búsqueda dinámica o generación fallback de AndroidManifest.xml compatible con SET_WALLPAPER.
# - Corrección de sintaxis YAML en línea 88: Eliminación de bloques heredoc anidados multilínea y creación segura del Manifest vía echo.
# - Solución al error ProcessApplicationManifest (package attribute AGP 8+): Limpieza de 'package="..."' mediante sed en AndroidManifest.xml.
# - Solución al error processReleaseResources (AAPT2 missing SettingsLib resources): Inyección de missing_aosp_resources.xml con colores, dimensiones y estilos fallback requeridos por AOSP.
# - Solución al error AAPT configChanges: Limpieza automática de la flag privada 'assetsPaths' en AndroidManifest.xml mediante sed.

name: Build AOSP WallpaperPicker2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout local repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Clone AOSP WallpaperPicker2
      run: |
        git clone https://android.googlesource.com/platform/packages/apps/WallpaperPicker2 source_code

    - name: Setup Project Structure and Manifest
      run: |
        cd source_code
        
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo "rootProject.name = 'WallpaperPicker2'" >> settings.gradle
        echo "include ':app'" >> settings.gradle

        echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle

        mkdir -p app/src/main/java
        mkdir -p app/src/main/res/values

        if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
        else
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> app/src/main/AndroidManifest.xml
            echo '    <uses-permission android:name="android.permission.SET_WALLPAPER" />' >> app/src/main/AndroidManifest.xml
            echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' >> app/src/main/AndroidManifest.xml
            echo '    <application android:allowBackup="true" android:label="Fondos AOSP" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">' >> app/src/main/AndroidManifest.xml
            echo '        <activity android:name=".TopLevelPickerActivity" android:exported="true" android:label="Fondos de pantalla">' >> app/src/main/AndroidManifest.xml
            echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
            echo '                <action android:name="android.intent.action.SET_WALLPAPER" />' >> app/src/main/AndroidManifest.xml
            echo '                <category android:name="android.intent.category.DEFAULT" />' >> app/src/main/AndroidManifest.xml
            echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
            echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
            echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
            echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
            echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
            echo '        </activity>' >> app/src/main/AndroidManifest.xml
            echo '    </application>' >> app/src/main/AndroidManifest.xml
            echo '</manifest>' >> app/src/main/AndroidManifest.xml
        fi

        # Eliminar atributo package inútil para AGP 8+ y remover la flag privada assetsPaths que causa fallo en AAPT2
        sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
        sed -i 's/assetsPaths|//g' app/src/main/AndroidManifest.xml
        sed -i 's/|assetsPaths//g' app/src/main/AndroidManifest.xml
        sed -i 's/assetsPaths//g' app/src/main/AndroidManifest.xml

        [ -d "src" ] && cp -r src/* app/src/main/java/ 2>/dev/null || true
        [ -d "res" ] && cp -r res/* app/src/main/res/ 2>/dev/null || true

        echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/missing_aosp_resources.xml
        echo '<resources>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_accent_secondary_device_default">#6200EE</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_colorSurface">#FFFFFF</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_colorSurfaceVariant">#F5F5F5</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_text_color_primary">#000000</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_text_color_secondary">#666666</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_text_color_secondary_device_default">#666666</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_colorSurfaceHeader">#EEEEEE</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <color name="settingslib_text_color_primary_device_default">#000000</color>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <dimen name="settingslib_toolbar_layout_height">56dp</dimen>' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '    <style name="CollapsingToolbarTitle.Collapsed" parent="TextAppearance.AppCompat.Widget.ActionBar.Title" />' >> app/src/main/res/values/missing_aosp_resources.xml
        echo '</resources>' >> app/src/main/res/values/missing_aosp_resources.xml

        echo "plugins { id 'com.android.application' }" > app/build.gradle
        echo "android {" >> app/build.gradle
        echo "    namespace 'com.android.wallpaper'" >> app/build.gradle
        echo "    compileSdk 34" >> app/build.gradle
        echo "    defaultConfig { applicationId 'com.android.wallpaper'; minSdk 28; targetSdk 34; versionCode 1; versionName '1.0' }" >> app/build.gradle
        echo "    buildTypes { release { minifyEnabled false } }" >> app/build.gradle
        echo "}" >> app/build.gradle
        echo "dependencies {" >> app/build.gradle
        echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> app/build.gradle
        echo "    implementation 'com.google.android.material:material:1.11.0'" >> app/build.gradle
        echo "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" >> app/build.gradle
        echo "}" >> app/build.gradle

    - name: Setup Gradle Wrapper
      run: |
        cd source_code
        gradle wrapper --gradle-version 8.5

    - name: Build APK with Gradle
      run: |
        cd source_code
        ./gradlew :app:assembleRelease --stacktrace

    - name: Sign APK
      run: |
        cd source_code/app/build/outputs/apk/release/
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --out WallpaperPicker2-signed.apk app-release-unsigned.apk

    - name: Generate Timestamp and Tag Name
      id: timestamp
      run: |
        BUILD_DATE=$(date +'%Y%m%d-%H%M')
        echo "TAG_NAME=Wallpaper2-Build-${BUILD_DATE}" >> $GITHUB_OUTPUT
        echo "RELEASE_NAME=Wallpaper2-Build-${BUILD_DATE}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.timestamp.outputs.TAG_NAME }}
        name: ${{ steps.timestamp.outputs.RELEASE_NAME }}
        draft: false
        prerelease: false
        files: |
          source_code/app/build/outputs/apk/release/WallpaperPicker2-signed.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
