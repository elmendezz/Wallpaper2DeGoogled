# Version: 4
# ChangeLog:
# - Versión inicial: Configuración de runner Ubuntu, setup de JDK 17 y Android SDK.
# - Clonación del repositorio AOSP WallpaperPicker2 desde Google Source.
# - Inyección de configuración Gradle básica (settings.gradle, build.gradle, wrapper).
# - Automatización de compilación de APK en modo Release/Unsigned.
# - Carga del APK resultante a los artifacts de GitHub Actions.
# - Corrección de error de Gradle 9.x: Inyección del bloque pluginManagement y definición de versión de com.android.application (8.2.2).
# - Inyección de repositorios google() y mavenCentral() en settings.gradle y build.gradle.
# - Adición de paso de firmado de APK usando apksigner con keystore de depuración.
# - Adición de generación automática de tag y release en GitHub con formato Wallpaper2-Build-YYYYMMDD-HHMM.
# - Adjuntado automático del archivo APK firmado directamente a la Release pública.
# - Solución al error AndroidXDependencyCheck: Inyección de gradle.properties habilitando android.useAndroidX=true y android.enableJetifier=true.
# - Solución al error ProcessApplicationManifest: Búsqueda dinámica o generación fallback de AndroidManifest.xml compatible con SET_WALLPAPER.

name: Build AOSP WallpaperPicker2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout local repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Clone AOSP WallpaperPicker2
      run: |
        git clone https://android.googlesource.com/platform/packages/apps/WallpaperPicker2 source_code

    - name: Generate Gradle Structure
      run: |
        cd source_code

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "WallpaperPicker2"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        mkdir -p app/src/main

        if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
        elif [ -f "AndroidManifest-common.xml" ]; then
            cp AndroidManifest-common.xml app/src/main/AndroidManifest.xml
        else
            cat << 'EOF2' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="com.android.wallpaper">

    <uses-permission android:name="android.permission.SET_WALLPAPER" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />

    <application
        android:allowBackup="true"
        android:label="Fondos de pantalla AOSP"
        android:supportsRtl="true"
        android:theme="@style/Theme.AppCompat.Light.NoActionBar">

        <activity
            android:name=".TopLevelPickerActivity"
            android:exported="true"
            android:label="Fondos de pantalla">
            <intent-filter>
                <action android:name="android.intent.action.SET_WALLPAPER" />
                <category android:name="android.intent.category.DEFAULT" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>

    </application>
</manifest>
EOF2
        fi

        mv src app/src/main/java 2>/dev/null || true
        mv res app/src/main/res 2>/dev/null || true

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.android.wallpaper'
            compileSdk 34

            defaultConfig {
                applicationId "com.android.wallpaper"
                minSdk 28
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Setup Gradle Wrapper
      run: |
        cd source_code
        gradle wrapper --gradle-version 8.5

    - name: Build APK with Gradle
      run: |
        cd source_code
        ./gradlew :app:assembleRelease --stacktrace

    - name: Sign APK
      run: |
        cd source_code/app/build/outputs/apk/release/
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --out WallpaperPicker2-signed.apk app-release-unsigned.apk

    - name: Generate Timestamp and Tag Name
      id: timestamp
      run: |
        BUILD_DATE=$(date +'%Y%m%d-%H%M')
        echo "TAG_NAME=Wallpaper2-Build-${BUILD_DATE}" >> $GITHUB_OUTPUT
        echo "RELEASE_NAME=Wallpaper2-Build-${BUILD_DATE}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.timestamp.outputs.TAG_NAME }}
        name: ${{ steps.timestamp.outputs.RELEASE_NAME }}
        draft: false
        prerelease: false
        files: |
          source_code/app/build/outputs/apk/release/WallpaperPicker2-signed.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
